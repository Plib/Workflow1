name: tutorial1
on: push

jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest
    steps:
    - name: setup python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

  job2:
    name: job2
    runs-on: windows-latest
    steps:
    - name: step2
      run: echo "Hello from job 2"
        echo "$(date)"

  job3:
    name: job3
    runs-on: ubuntu-latest
    steps:
    - name: step 3
      run: echo "Hello from job 3"
        echo "$(date)"

  job4:
    name: job4
    runs-on: ubuntu-latest
    needs: [job1, job2]
    steps:
    - name: step 4
      run: echo "I am job 4"
